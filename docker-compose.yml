version: "3.9"

services:
  firewall:
    build: .
    ports:
      - "${LLMFW_SERVER_PORT:-8000}:8000"
    environment:
      - LLMFW_TOXICITY_THRESHOLD=${LLMFW_TOXICITY_THRESHOLD:-0.5}
      - LLMFW_SENTIMENT_THRESHOLD=${LLMFW_SENTIMENT_THRESHOLD:-0.9}
      - LLMFW_SEMANTIC_THRESHOLD=${LLMFW_SEMANTIC_THRESHOLD:-0.8}
      - LLMFW_DEVICE=cpu
      - LLMFW_CHROMADB_PERSIST_DIRECTORY=/data/chromadb
      - LLMFW_MODEL_CACHE_DIR=/data/models
      - LLMFW_SERVER_LOG_LEVEL=info
      - LLMFW_API_KEY=${LLMFW_API_KEY:-}
    volumes:
      - firewall_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

volumes:
  firewall_data:
