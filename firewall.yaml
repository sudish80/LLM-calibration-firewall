# LLM Firewall Configuration

## Detection Thresholds
toxicity_threshold: 0.5
sentiment_threshold: 0.9
semantic_threshold: 0.8

## Neural Judge Thresholds
neural_hard_block_threshold: 0.75
neural_moderate_block_threshold: 0.60
neural_edu_override_threshold: 0.60
edu_override_score: 0.35

## Hardware
device: auto

## Paths
chromadb_persist_directory: ./data/chromadb
model_cache_dir: ./data/models

## Server
server_host: 0.0.0.0
server_port: 8000
server_log_level: info
server_log_format: text     # text or json
server_workers: 1
server_rate_limit_max: 60
server_rate_limit_window: 60.0
cors_origins:
  - "*"
max_input_length: 10000

## Auth (leave empty to disable)
api_key: ""
jwt_secret: ""

## Cache
cache_maxsize: 10000
cache_ttl: 300.0

## Audit
audit_log_path: ./data/audit.jsonl
