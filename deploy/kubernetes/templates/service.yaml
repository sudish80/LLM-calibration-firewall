apiVersion: v1
kind: Service
metadata:
  name: {{ include "llmfirewall.fullname" . }}
  labels: {{- include "llmfirewall.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app: {{ include "llmfirewall.name" . }}
